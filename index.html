<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Animation App - Carley World Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <div class="menu-bar">
            <div class="menu-item">
                <span>Archivo</span>
                <div class="dropdown-menu">
                    <div class="dropdown-item disabled">Nuevo</div>
                    <div class="dropdown-item disabled">Abrir Escena</div>
                    <div class="dropdown-item disabled">Guardar Escena</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item disabled">Importar Modelo...</div>
                </div>
            </div>
            <div class="menu-item">
                <span>Editar</span>
                <div class="dropdown-menu">
                    <div class="dropdown-item disabled">Deshacer</div>
                    <div class="dropdown-item disabled">Rehacer</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item disabled">Preferencias</div>
                </div>
            </div>
            <div class="menu-item">
                <span>Crear</span>
                <div class="dropdown-menu">
                    <div class="dropdown-item" id="btn-add-cube">Malla -> Cubo</div>
                </div>
            </div>
            <div class="menu-item">
                <span>Ventana</span>
                <div class="dropdown-menu">
                    <div class="dropdown-item">Restablecer Layout</div>
                </div>
            </div>
        </div>
        <div class="status-bar">Modo Objeto</div>
    </div>
    <div id="app-container">
        <div id="jerarquia-panel" class="panel">
            <div class="panel-title">Jerarquía</div>
            <div class="panel-content"></div>
        </div>
        <div class="resizer" id="resizer-left"></div>
        <div id="visor-panel" class="panel">
            <div class="panel-title">Visor 3D</div>
            <div class="panel-content"></div>
        </div>
        <div class="resizer" id="resizer-right"></div>
        <div id="inspector-panel" class="panel">
            <div class="panel-title">Inspector</div>
            <div class="panel-content"></div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
