<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Web Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container"></div>
    <div id="dock-overlay" class="hidden">
        <div class="drop-zone" data-zone="center"></div>
        <div class="drop-zone" data-zone="top"></div>
        <div class="drop-zone" data-zone="bottom"></div>
        <div class="drop-zone" data-zone="left"></div>
        <div class="drop-zone" data-zone="right"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
